AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role for GitHub Actions static portfolio deployment.

Parameters:
  GitHubOwner:
    Type: String
    Default: karan57226
  GitHubRepo:
    Type: String
    Default: CloudEngineerWebApp
  SiteBucketName:
    Type: String
    Description: S3 bucket name from the static-site stack output.
  CloudFrontDistributionId:
    Type: String
    Description: CloudFront distribution id from the static-site stack output.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-deploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: StaticSiteDeployPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SiteBucketName}"
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SiteBucketName}/*"
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"

Outputs:
  GitHubActionsRoleArn:
    Description: Add this to GitHub secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubActionsDeployRole.Arn
